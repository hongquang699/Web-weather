<!-- Component: weather-alert.html -->
<div id="severeAlertBanner" class="alert-banner hidden">
  <i class="fa-solid fa-triangle-exclamation alert-icon"></i>
  <div class="alert-content">
    <div class="alert-title" id="alertTitle">⚠️ CẢNH BÁO THỜI TIẾT NGUY HIỂM</div>
    <div class="alert-desc" id="alertDesc">Khu vực có khả năng xuất hiện thời tiết cực đoan. Vui lòng chú ý an toàn.</div>
  </div>
  <button class="close-alert-btn" id="dismissAlertBtn"><i class="fa-solid fa-xmark"></i></button>
</div>

<div id="rainNoticeBanner" class="alert-banner rain-notice hidden">
  <i class="fa-solid fa-cloud-showers-heavy alert-icon"></i>
  <div class="alert-content">
    <div class="alert-title" style="color: #bae6fd;">🌧️ THÔNG BÁO SẮP CÓ MƯA</div>
    <div class="alert-desc" id="rainNoticeText">Xác suất mưa cao trong 1-2 giờ tới. Hãy mang theo ô hoặc áo mưa!</div>
  </div>
</div>
