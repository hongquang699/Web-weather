<!-- Component: header.html -->
<header class="app-header">
  <div class="brand">
    <i class="fa-solid fa-cloud-sun-rain logo-icon"></i>
    <div>
      <h1 class="brand-title">VietWeather</h1>
      <p class="brand-subtitle">Dự Báo Thời Tiết 63 Tỉnh Thành Thời Gian Thực</p>
    </div>
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="themeModeBtn" title="Chuyển chế độ Giao diện">
      <i class="fa-solid fa-circle-half-stroke" id="themeModeIcon"></i>
    </button>
    <button class="icon-btn" id="favToggleBtn" title="Lưu địa điểm">
      <i class="fa-regular fa-star" id="favStarIcon"></i>
    </button>
    <button class="icon-btn" id="geoBtn" title="Định vị GPS">
      <i class="fa-solid fa-location-crosshairs"></i>
    </button>
    <div class="unit-toggle-group">
      <button class="unit-btn active" id="unitC">°C</button>
      <button class="unit-btn" id="unitF">°F</button>
    </div>
  </div>
</header>
