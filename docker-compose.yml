version: '3.8'

services:
  # 1. Redis In-Memory Cache Service
  redis:
    image: redis:7-alpine
    container_name: weather_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 2. Django REST API Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weather_backend
    restart: always
    depends_on:
      - redis
    environment:
      - DEBUG=False
      - SECRET_KEY=django-prod-weather-secret-key-3849723
      - ALLOWED_HOSTS=*
      - REDIS_URL=redis://redis:6379/1
    volumes:
      - ./backend:/app
      - backend_db:/app/db_data
    ports:
      - "8000:8000"

  # 3. Nginx Web Server & Reverse Proxy
  frontend:
    image: nginx:alpine
    container_name: weather_nginx
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  redis_data:
  backend_db:
