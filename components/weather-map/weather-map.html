<!-- Component: weather-map.html -->
<div class="radar-box">
  <div class="section-header-row">
    <h3 class="section-title"><i class="fa-solid fa-satellite-dish"></i> Bản Đồ Radar Thời Tiết & Vệt Mưa Trực Tiếp</h3>
    <button class="toggle-pill-btn active" id="radarPlayBtn"><i class="fa-solid fa-play"></i> Quét vệt mưa</button>
  </div>
  <div class="radar-map-wrapper">
    <div id="radarMap" class="radar-map"></div>
    <div class="radar-legend">
      <span class="radar-label" id="radarTimeLabel">Đang tải vệt mưa thời gian thực...</span>
      <div class="radar-gradient-bar"></div>
      <span class="radar-label" style="color: #fca5a5;">Mưa to/Dông</span>
    </div>
  </div>
</div>
