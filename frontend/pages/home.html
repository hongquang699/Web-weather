<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trang Chủ - MeteoLive</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
  <div class="app-container">
    <div style="margin-bottom: 20px;">
      <a href="../index.html" class="map-badge"><i class="fa-solid fa-arrow-left"></i> Quay lại ứng dụng chính</a>
    </div>
    <div class="current-card">
      <div class="card-top">
        <div class="location-info">
          <h2>Hà Nội, Việt Nam</h2>
          <div class="local-time">Thời tiết thời gian thực</div>
        </div>
      </div>
      <div class="weather-main-row">
        <i class="fa-solid fa-cloud-sun weather-icon-large" style="color: #facc15"></i>
        <div class="temp-huge">29<span class="temp-unit">°C</span></div>
      </div>
      <p>Trời quang đãng, nắng ấm • Độ ẩm: 68% • Gió: 12 km/h</p>
    </div>
  </div>
  <!-- Anti-Tampering Shield -->
  <script src="../js/security.js"></script>
</body>
</html>
