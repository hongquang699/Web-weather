<!-- Component: search.html -->
<div class="search-wrapper">
  <div class="search-bar">
    <i class="fa-solid fa-magnifying-glass search-icon" style="color: var(--text-dim); margin-right: 8px;"></i>
    <input type="text" id="cityInput" class="search-input" placeholder="Gõ tên tỉnh thành (Ví dụ: Hà Nội, Đà Nẵng, TP.HCM, Sa Pa...)" autocomplete="off" />
    <button id="clearSearchBtn" class="clear-search-btn" title="Xóa tìm kiếm"><i class="fa-solid fa-circle-xmark"></i></button>
  </div>
  <div id="suggestionsList" class="suggestions-dropdown"></div>
</div>
